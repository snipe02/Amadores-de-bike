<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <title>Amadores de Bike | Inscrição Oficial</title>
    <link rel="icon" type="logo1.jpeg" href="logo1.jpeg" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <!-- jsPDF e plugins -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Firebase Import Map -->
    <script type="importmap">
      {
        "imports": {
          "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
          "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
        }
      }
    </script>

    <!-- CSS customizado -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ========== PROTEÇÃO CONTRA INSPEÇÃO ========== -->
    <script>
      (function () {
        document.addEventListener("contextmenu", (e) => e.preventDefault());
        document.addEventListener("keydown", (e) => {
          const key = e.key || e.keyCode;
          if (
            key === "F12" ||
            key === 123 ||
            (e.ctrlKey && e.shiftKey && (key === "I" || key === 73)) ||
            (e.ctrlKey && e.shiftKey && (key === "J" || key === 74)) ||
            (e.ctrlKey && (key === "U" || key === 85)) ||
            (e.ctrlKey && e.shiftKey && (key === "C" || key === 67)) ||
            (e.ctrlKey && e.shiftKey && (key === "K" || key === 75))
          ) {
            e.preventDefault();
            return false;
          }
        });
        (function detectDevTools() {
          var start = new Date();
          debugger;
          var end = new Date();
          if (end - start > 100) window.location.href = "about:blank";
        })();
        document.addEventListener("dragover", (e) => e.preventDefault());
        document.addEventListener("drop", (e) => e.preventDefault());
      })();
    </script>

    <!-- ===== MODAIS ===== -->
    <!-- Modal Login Admin -->
    <div id="modalLogin" class="modal-overlay hidden">
      <div class="modal-box animate-fadeIn">
        <p class="modal-title">
          <i class="fas fa-shield-alt"></i> Área Restrita
        </p>
        <p class="text-sm text-gray-500 mb-3">Acesso administrativo</p>
        <div class="form-group">
          <label class="form-label">E-mail</label>
          <input
            type="email"
            id="adminEmail"
            class="form-input"
            placeholder="admin@ecociclismo.com"
          />
        </div>
        <div class="form-group">
          <label class="form-label">Senha</label>
          <input
            type="password"
            id="adminPassword"
            class="form-input"
            placeholder="••••••"
          />
        </div>
        <div id="loginErrorMsg" class="text-red-600 text-sm mb-3 hidden">
          E-mail ou senha inválidos!
        </div>
        <div class="modal-footer">
          <button id="btnCancelarLogin" class="btn btn-gray">Cancelar</button>
          <button id="btnLoginAdmin" class="btn btn-purple">Entrar</button>
        </div>
      </div>
    </div>

    <!-- Modal de Edição -->
    <div id="modalEdit" class="modal-overlay hidden">
      <div class="modal-box">
        <p class="modal-title">
          <i class="fas fa-user-edit"></i> Editar Inscrição
        </p>
        <div class="form-group">
          <label class="form-label">Nome completo</label>
          <input
            type="text"
            id="editNome"
            class="form-input"
            placeholder="Nome"
          />
        </div>
        <div class="form-group">
          <label class="form-label">Equipe</label>
          <input
            type="text"
            id="editEquipe"
            class="form-input"
            placeholder="Equipe"
          />
        </div>
        <input type="hidden" id="editId" />
        <div class="modal-footer">
          <button id="btnCancelEdit" class="btn btn-gray">Cancelar</button>
          <button id="btnSaveEdit" class="btn btn-green">
            Salvar Alterações
          </button>
        </div>
      </div>
    </div>

    <!-- ===== HEADER ===== -->
    <header class="eco-header">
      <div class="eco-logo" id="logoSecreto">
        <img
          src="logo1.jpeg"
          alt="Logo"
          style="
            height: 40px;
            width: 40px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 8px;
          "
        />
        <h1>AMADORES DE BIKE</h1>
      </div>
      <div style="display: flex; align-items: center; gap: 12px">
        <span class="eco-badge"><i class="fas fa-gift"></i> Inscrição Pago</span>
        <span class="eco-badge"><i class=""></i>🗓️06/09/2026</span>
        <div id="adminLogoutContainer" style="display: none">
          <button id="btnSairAdmin" class="btn-sm btn-white-transparent">
            <i class="fas fa-sign-out-alt"></i> Sair Admin
          </button>
        </div>
      </div>
    </header>

    <!-- ===== NAVEGAÇÃO ===== -->
    <nav class="tab-nav">
      <div class="tab-nav-inner">
        <button class="tab-btn" data-tab="inscricao">
          <i class="fas fa-user-edit"></i> Inscrição
        </button>
        <button
          class="tab-btn tab-hidden"
          id="tabConfirmadoBtn"
          data-tab="confirmado"
        >
          <i class="fas fa-check-circle"></i> Confirmação
        </button>
        <button class="tab-btn tab-hidden" id="tabAdminBtn" data-tab="admin">
          <i class="fas fa-shield-alt"></i> Admin
        </button>
      </div>
    </nav>

    <!-- ===== CONTEÚDO ===== -->
    <main class="content-area">
      <!-- Painel Inscrição -->
      <section id="panel-inscricao" class="panel ativo">
        <div class="card animate-fadeIn">
          <div class="card-header green">
            <i class="fas fa-user-plus"></i> Nova Inscrição
          </div>
          <div class="card-body">
            <div class="form-group">
              <label class="form-label obrigatorio">Nome completo</label>
              <input
                type="text"
                id="nome"
                class="form-input"
                placeholder="Digite seu nome"
              />
            </div>
            <div class="form-group">
              <label class="form-label obrigatorio">Cidade</label>
              <input
                type="text"
                id="cidade"
                class="form-input"
                placeholder="Sua cidade"
              />
            </div>
            <div class="form-group">
              <label class="form-label obrigatorio">Equipe</label>
              <input
                type="text"
                id="equipe"
                class="form-input"
                placeholder="Ex: Equipe Velozes / Bike Team"
              />
            </div>
            <div class="form-group">
              <label class="form-label obrigatorio">Idade</label>
              <input
                type="number"
                id="idade"
                class="form-input"
                placeholder="Ex: 28"
                min="1"
                max="120"
              />
            </div>
            <div class="form-group">
              <label class="form-label obrigatorio">Gênero</label>
              <select id="genero" class="form-input">
                <option value="">Selecione...</option>
                <option value="Masculino">Masculino</option>
                <option value="Feminino">Feminino</option>
                <option value="Prefiro não informar">
                  Prefiro não informar
                </option>
              </select>
            </div>
            <div class="valor-aviso">
              <i class="fas fa-check-circle"></i> Inscrição — confirmação
              imediata.
            </div>
            <button id="nGerarInscricao" class="btn btn-orange">
              <i class="fas fa-ticket-alt"></i> Realizar inscrição
            </button>
          </div>
        </div>
      </section>

      <!-- Painel Confirmação -->
      <section id="panel-confirmado" class="panel">
        <div class="card">
          <div class="card-header teal">
            <i class="fas fa-medal"></i> Inscrição Confirmada
          </div>
          <div class="card-body" id="confirmadoDinamico">
            <div style="text-align: center; padding: 48px 0; color: #9ca3af">
              <i class="fas fa-hourglass-half fa-2x"></i>
              <p>Nenhuma inscrição ativa</p>
            </div>
          </div>
        </div>
      </section>

      <!-- Painel Admin -->
      <section id="panel-admin" class="panel">
        <div class="card">
          <div class="card-header purple">
            <i class="fas fa-database"></i> Banco de Dados — Inscrições
            Gratuitas
          </div>
          <div class="card-body" id="adminPanelRoot">
            <p style="color: #9ca3af; text-align: center; padding: 32px 0">
              Carregando dados...
            </p>
          </div>
        </div>
      </section>
    </main>

    <!-- ===== SCRIPT PRINCIPAL (módulo) ===== -->
    <script type="module" src="pix.js"></script>
  </body>
</html>
